name: deploy
# Runs only after the `ci` workflow succeeded on a push to main (or by hand).
# The `production` environment's required reviewers must approve before the job starts.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # PLACEHOLDER URL: set repository variable SMOKE_URL to the real production URL.
      SMOKE_URL: ${{ vars.SMOKE_URL || 'https://todo-demo.vercel.app' }}
      VERCEL_CLI: vercel@41.0.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # the commit CI validated (workflow_dispatch falls back to the selected ref)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Pull Vercel settings
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build
        run: npx --yes "$VERCEL_CLI" build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy
        run: npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Smoke test
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 10 --retry-all-errors -L "$SMOKE_URL" || true)
          echo "GET $SMOKE_URL -> HTTP $code"
          [ "$code" = "200" ]
