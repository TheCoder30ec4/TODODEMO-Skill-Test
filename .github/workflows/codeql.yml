name: codeql
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  # Only superseded PR runs are cancelled; main pushes and scheduled scans always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # javascript-typescript and actions are analysed without a build (build-mode: none).
      - uses: github/codeql-action/init@v4.39.3
        with:
          languages: javascript-typescript,actions
      - uses: github/codeql-action/analyze@v4.39.3
